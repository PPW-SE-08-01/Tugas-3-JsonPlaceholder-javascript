
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Praktikum Fetch API</h1>
        <p>Pengujian GET, POST, PUT, dan DELETE menggunakan JSONPlaceholder.</p>

        <div class="buttons">
            <button id="btn-get">GET</button>
            <button id="btn-post">POST</button>
            <button id="btn-put">PUT</button>
            <button id="btn-delete">DELETE</button>
        </div>

        <h2>Hasil Respons API</h2>
        <div id="output">Klik tombol untuk mencoba Fetch API.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
