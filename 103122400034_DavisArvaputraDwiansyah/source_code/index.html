<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Fetch API - Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Eksplorasi Fetch API (JSONPlaceholder)</h1>
        <p class="subtitle">Klik tombol di bawah untuk menguji setiap metode HTTP:</p>

        <!-- Tombol Aksi HTTP -->
        <div class="button-group">
            <button id="btn-get" class="btn btn-get">GET (Ambil Data)</button>
            <button id="btn-post" class="btn btn-post">POST (Tambah Data)</button>
            <button id="btn-put" class="btn btn-put">PUT (Update Data)</button>
            <button id="btn-delete" class="btn btn-delete">DELETE (Hapus Data)</button>
        </div>

        <!-- Area Tampilan Hasil -->
        <div class="output-section">
            <h2>Status & Respons API:</h2>
            <div id="output" class="output-box">
                <p class="placeholder">Hasil respons API akan muncul di sini...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
