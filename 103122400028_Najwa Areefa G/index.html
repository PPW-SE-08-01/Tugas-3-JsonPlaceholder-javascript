<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Web - Fetch API</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#A7C7E4] min-h-screen text-[#5D7B3D] py-10 px-4 flex justify-center items-center ">

    <div class="max-w-2xl w-full bg-white shadow-xl rounded-3xl p-6 md:p-8 space-y-6">
        
        <div>
            <h1 class="text-2xl font-extrabold text-[#E4568B]">Praktikum Pemrograman Web</h1>
            <p class="text-sm text-[#5D7B3D]/80 mt-1">Fetch API & Asynchronous JavaScript</p>
        </div>

        <div class="grid grid-cols-4 gap-2 bg-[#F29BB9]/20 p-2 border border-[#F29BB9]/30 rounded-2xl">
            <button onclick="switchTab('get')" id="tabGet" class="py-2 text-xs font-bold rounded-xl transition-all cursor-pointer">GET</button>
            <button onclick="switchTab('post')" id="tabPost" class="py-2 text-xs font-bold rounded-xl transition-all cursor-pointer">POST</button>
            <button onclick="switchTab('put')" id="tabPut" class="py-2 text-xs font-bold rounded-xl transition-all cursor-pointer">PUT</button>
            <button onclick="switchTab('delete')" id="tabDelete" class="py-2 text-xs font-bold rounded-xl transition-all cursor-pointer">DELETE</button>
        </div>

        <div id="formContainer" class="bg-[#F6C94D]/10 p-5 rounded-2xl border border-[#F6C94D]/30">
        </div>

        <div class="bg-[#5D7B3D] border border-[#5D7B3D] rounded-2xl p-5 shadow-inner">
            <h2 class="text-xs font-bold tracking-wider text-[#F6C94D] uppercase mb-3">Hasil Respons API:</h2>
            <div id="outputContainer" class="text-white font-mono text-xs max-h-72 overflow-y-auto space-y-3">
                <p class="text-[#A7C7E4] italic">Pilih metode di atas untuk mulai menguji...</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
